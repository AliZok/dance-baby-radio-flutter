name: dance_baby_radio_flutter
description: Dance Baby Radio Flutter Android app v2 — radio player, auth, and playlists matching the Nuxt 3 frontend.
version: 2.1.0+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase integration
  supabase_flutter: ^2.8.0

  # Audio playback (supports dual-player gapless transitions)
  just_audio: ^0.9.42

  # Lock screen / notification media controls (play, pause, next)
  audio_service: ^0.18.15

  # Video background for specific genres
  video_player: ^2.9.2

  # Local storage for saving active genres
  shared_preferences: ^2.2.3

  # Beautiful typography matching Vuetify/Tailwind
  google_fonts: ^6.2.1

  # Cyberpunk loading spinners
  flutter_spinkit: ^5.2.1

  # Caching for network images (covers)
  cached_network_image: ^3.4.1

  # Svg support if needed
  flutter_svg: ^2.0.10+1
  audio_session: ^0.1.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/dance-baby-radio-back-black.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/dance-baby-radio-back-black.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
